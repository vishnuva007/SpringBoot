version: "3.7"

services:
  app:
    build: .
    ports:
      - "8081:8081"
    networks:
      - my-network


  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vishnu
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-my-data:/var/lib/postgresql/data

    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
    postgres-my-data: